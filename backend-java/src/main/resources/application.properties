spring.application.name=task-manager-be

# PostgreSQL (see docker-compose.yml at the repo root). Credentials come from the environment, never from this file.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${POSTGRES_JAVA_PORT:5432}/taskmanager_java}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Frontend origins allowed by CORS (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Schema is managed by Flyway (src/main/resources/db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
