name: Backend Java

on:
  push:
    branches: [main]
    paths: ['backend-java/**', '.github/workflows/backend-java.yml']
  pull_request:
    paths: ['backend-java/**', '.github/workflows/backend-java.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Testcontainers starts PostgreSQL itself (Docker is available on ubuntu-latest)
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify
